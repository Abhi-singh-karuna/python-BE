version: "3.8"

services:
  app:
    container_name: pro-policy-app
    build:
      context: .
      args:
        - DB_HOST=host.docker.internal
        - DB_USER=postgres
        - DB_PASSWORD=123456789
        - DB_NAME=PolicyPro
        - DB_PORT=5432
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
