version: "3.8"

services:
  app:
    container_name: pro-policy-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config  
    environment:
      - POLICY_GENERAL__SQL__WRITE__HOST=host.docker.internal
      - POLICY_GENERAL__SQL__WRITE__USER=postgres
      - POLICY_GENERAL__SQL__WRITE__PASSWORD=123456789
      - POLICY_GENERAL__SQL__WRITE__DATABASE=PolicyPro
      - POLICY_GENERAL__SQL__WRITE__PORT=5432
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
